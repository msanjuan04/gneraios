<!doctype html>
<html lang="es">
  <body style="margin:0;padding:32px 16px;background:#f5f6f8;font-family:Manrope,-apple-system,Segoe UI,Helvetica,Arial,sans-serif;color:#04060a;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
      <tr>
        <td align="center">
          <table role="presentation" width="480" cellpadding="0" cellspacing="0" style="max-width:480px;background:#ffffff;border-radius:16px;padding:40px 36px;">
            <tr>
              <td>
                <p style="margin:0 0 28px;font-size:13px;font-weight:800;letter-spacing:0.2em;">GNERAI OS</p>
                <h1 style="margin:0 0 12px;font-size:24px;line-height:1.2;font-weight:800;letter-spacing:-0.02em;">Tu enlace de acceso</h1>
                <p style="margin:0 0 28px;font-size:15px;line-height:1.6;color:#4a4d55;">Pulsa el botón para entrar. El enlace caduca en una hora y solo sirve una vez.</p>
                <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=email"
                   style="display:inline-block;padding:12px 24px;border-radius:9999px;background:#173697;background-image:linear-gradient(135deg,#173697,#2e80ff);color:#ffffff;font-size:14px;font-weight:700;text-decoration:none;">Entrar en GNERAI OS</a>
                <p style="margin:28px 0 0;font-size:12px;line-height:1.6;color:#8a8d94;">Si no has pedido este enlace, ignora este correo.</p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
